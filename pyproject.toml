[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olympia-schroedinger"
version = "0.2.0"
description = "Schrodinger equation demonstrations with numerical validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "tqdm>=4.66"]

[project.optional-dependencies]
test = ["pytest>=8"]
app = ["streamlit>=1.66.1,<2"]

[project.scripts]
schroedinger = "schroedinger.cli:entrypoint"
schroedinger-app = "schroedinger.app:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
